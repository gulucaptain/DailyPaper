baseURL = "https://gulucaptain.github.io/DailyPaper/"
languageCode = "zh-CN"
title = "gulucaptain's Blog"
theme = "PaperMod"
defaultContentLanguage = "zh"
hasCJKLanguage = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
[pagination]
  pagerSize = 10

[params]
  mainSections = ["posts", "math"]
  env = "production"
  title = "gulucaptain's Blog"
  description = "技术探索与思考"
  author = "gulucaptain"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.assets]
    favicon = "favicon.svg?v=b1"
    favicon16x16 = "favicon-16x16.png?v=b1"
    favicon32x32 = "favicon-32x32.png?v=b1"
    apple_touch_icon = "apple-touch-icon.png?v=b1"
    safari_pinned_tab = "safari-pinned-tab.svg?v=b1"

  [params.homeInfoParams]
    Title = "Hi, I'm gulucaptain 👋"
    Content = "技术探索 · AI · 工程实践 · [搜索论文](search/) · [📖 阅读剪藏](clips/)"

  [[params.socialIcons]]
    name = "github"
    url = "https://gulucaptain.github.io/"

[menu]
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 5
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "clips"
    name = "剪藏"
    url = "/clips/"
    weight = 15
  [[menu.main]]
    identifier = "math"
    name = "Math"
    url = "/math/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30
  [[menu.main]]
    identifier = "friends"
    name = "友链"
    url = "/friends/"
    weight = 35
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 40

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]
