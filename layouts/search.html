{{- define "main" }}

<header class="page-header">
    <h1>{{- (printf "%s&nbsp;" .Title ) | htmlUnescape -}}
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
    </h1>
    {{- if .Description }}
    <div class="post-description">
        {{ .Description }}
    </div>
    {{- end }}
    {{- if not (.Param "hideMeta") }}
    <div class="post-meta">
        {{- partial "translation_list.html" . -}}
    </div>
    {{- end }}
</header>

<div id="searchbox" class="searchbox">
    <input id="searchInput" disabled placeholder="{{ .Params.placeholder | default (printf "%s ↵" .Title) }}"
        aria-label="搜索论文与文章" aria-describedby="searchStatus" type="search" autocomplete="off" maxlength="64">
    <div class="search-tools">
        <label for="searchType">范围</label>
        <select id="searchType">
            <option value="all">全部</option>
            <option value="paper">论文</option>
            <option value="article">文章 / 日报</option>
        </select>
        <label for="searchSort">排序</label>
        <select id="searchSort">
            <option value="relevance">相关度</option>
            <option value="newest">最新优先</option>
        </select>
    </div>
    <p id="searchStatus" class="post-meta" role="status" aria-live="polite">正在加载搜索索引…</p>
    <noscript><p>请启用 JavaScript 以搜索，或通过<a href="{{ "archives/" | relURL }}">归档</a>浏览文章。</p></noscript>
    <div id="searchResults" class="searchResults" role="list" aria-label="搜索结果"></div>
    <div class="pagination"><button id="searchMore" type="button" hidden>显示更多</button></div>
</div>

{{- end }}{{/* end main */}}
